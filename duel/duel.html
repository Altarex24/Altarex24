  #bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--acc); width: 0; }
  .comic { font-family: "Arial Black", "Trebuchet MS", Impact, sans-serif; font-weight: 900; paint-order: stroke fill; stroke: #1f2330; stroke-linejoin: round; }
  .o { stroke: #1f2330; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>

// =====================================================================
//  LE DUEL DES ROUES — film d'animation 2D (SVG + WebAudio)
//  Tout est piloté par renderAt(t) : déterministe, donc exportable image par image.
// =====================================================================
const DUR = 44;
const NS = "http://www.w3.org/2000/svg";

// ---------- utilitaires d'animation ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: k => k,
  in: k => k * k * k,
  out: k => 1 - (1 - k) ** 3,
  io: k => (k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2),
  back: k => { const c = 1.9; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; },
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
// piste : [[t, valeur, easing du segment qui se termine ici], ...]
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) {
      const [t0, v0] = keys[i - 1];
      const k = (E[e || "io"])((t - t0) / (t1 - t0 || 1));
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], k)) : lerp(v0, v1, k);
    }
  }
  return keys[keys.length - 1][1];
}
const inRange = (t, a, b) => t >= a && t < b;
const rnd = (() => { let s = 12345; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
function el(parent, tag, attrs = {}, html) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e); return e;
}
const show = (e, v) => { e.style.display = v ? "" : "none"; };
function setMood(g, mood) { g.querySelectorAll("[data-m]").forEach(n => show(n, n.dataset.m.split(" ").includes(mood))); }

// ---- roues ----
function wheel(id, cx, cy, r, hub = "#c9c7d6", tire = "#23242b") {
  const spokes = [...Array(5)].map((_, i) => { const a = i * 72 * Math.PI / 180; return `M0 0 L${(Math.cos(a) * r * .42).toFixed(1)} ${(Math.sin(a) * r * .42).toFixed(1)}`; }).join("");
  return `<g transform="translate(${cx} ${cy})"><g id="${id}">
    <circle r="${r}" fill="${tire}" stroke="${C.line}" stroke-width="4"/>
    <circle r="${r - 5}" fill="none" stroke="#3b3c46" stroke-width="6" stroke-dasharray="7 6"/>
    <circle r="${r * .5}" fill="${hub}" stroke="${C.line}" stroke-width="3"/>
    <path d="${spokes}" stroke="#8d8b9c" stroke-width="5" stroke-linecap="round"/>
    <circle r="${r * .12}" fill="#8d8b9c"/></g></g>`;
}

function rays(g, n, color, len = 1100) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, b = a + Math.PI / n * .55;
    s += `<path d="M0 0 L${(Math.cos(a) * len).toFixed(0)} ${(Math.sin(a) * len).toFixed(0)} L${(Math.cos(b) * len).toFixed(0)} ${(Math.sin(b) * len).toFixed(0)}Z" fill="${color}"/>`;
  }
  g.innerHTML = s;
}

// =====================================================================
//  TIMELINE
// =====================================================================
const GROUND = 600, TS = 1.25, CS = 1.3, PS = .55; // échelles camion / voiture / perso
const FLASHES = [[3.05, .25], [10.55, .2], [13.05, .2], [17.0, .12], [22.6, .22], [29.0, .25], [31.0, .15], [33.5, .3], [40.0, .25]];
const SHAKES = [[7.2, 1.1, 6], [10.6, .45, 14], [15.8, .5, 4], [22.6, .55, 20], [29.0, .9, 16], [31.0, .4, 10]];

function scene(t) {
  if (t < 3.2) return "title";
  if (t < 10) return "world";
  if (t < 13.2) return "vs";
  if (t < 21.0) return "world";
  if (t < 21.8) return "cuEnemy";
  if (t < 23.2) return "world";
  if (t < 24.0) return "cuHero";
  if (t < 25.0) return "world";
  if (t < 27.0) return "split";
  if (t < 40) return "world";
  return "end";
}
// positions des véhicules
function truckState(t) {
  let x, dir = 1, rot = 0;
  if (t < 17) x = 900;
  else x = track(t, [[17, 450], [18.2, 450], [20.0, 880, "in"], [20.8, 950, "out"], [22.6, 950], [23.2, 1250, "out"], [27.0, 1250], [29.0, 900, "in"]]);
  if (t >= 24.0) dir = t < 24.45 ? Math.cos((t - 24.0) / .45 * Math.PI) : -1;
  if (inRange(t, 22.6, 23.6)) rot = -Math.sin((t - 22.6) * 22) * 7 * (1 - (t - 22.6));
  if (inRange(t, 29.0, 29.4)) rot = Math.sin((t - 29) * 40) * 2;
  let y = GROUND;
  const engine = t >= 7.2;
  if (engine) y -= Math.abs(Math.sin(t * 38)) * (inRange(t, 7.2, 8.4) ? 5 : 1.5);
  return { x, y, dir, rot, engine };
}
function carState(t) {
  let x, y = GROUND, dir = -1, rot = 0, pivot = 0, vis = true;
  if (t < 17) { x = 1600; if (inRange(t, 15.8, 17)) { rot = Math.sin(clamp((t - 15.8) / 1.2) * Math.PI) * 16; pivot = 74; } }
  else if (t < 20.0) x = track(t, [[17, 1500], [18.2, 1500], [20.0, 1030, "in"]]);
  else if (t < 20.9) { const k = (t - 20) / .9; x = lerp(1030, 330, k); y = GROUND - Math.sin(k * Math.PI) * 300; rot = -k * 360; }
  else if (t < 21.8) x = 330;
  else {
    dir = 1;
    if (t < 27) x = track(t, [[21.8, 330], [22.0, 300], [22.6, 480, "in"], [23.2, 250, "out"]]);
    else if (t < 29.25) x = track(t, [[27, 150], [29.0, 330, "in"]]);
    else if (t < 31.0) { const k = (t - 29.25) / 1.75; x = lerp(330, -420, E.out(k)); y = GROUND - (Math.sin(k * Math.PI) * 360) + k * 110; rot = -k * 900; }
    else { vis = false; x = -420; }
  }
  if (t >= 18.2 && t < 29.25 && !(t >= 20 && t < 20.9)) y -= Math.abs(Math.sin(t * 45)) * 1.5;
  return { x, y, dir, rot, pivot, vis };
}
function camera(t) {
  let c;
  if (t < 10) c = track(t, [[3.2, [600, 420, 1]], [6.0, [760, 420, 1]], [6.8, [880, 420, 1.05]], [7.2, [985, 370, 1.35], "out"], [8.6, [950, 400, 1.15]], [10, [950, 400, 1.22]]]);
  else if (t < 17) c = track(t, [[13.2, [1480, 420, 1]], [15.0, [1500, 400, 1.3]], [15.6, [1580, 430, 1.1]], [17, [1600, 440, 1.25]]]);
  else if (t < 18.2) c = track(t, [[17, [975, 430, .82]], [18.2, [975, 430, .9]]]);
  else if (t < 20) { const tr = truckState(t), ca = carState(t); c = [(tr.x + ca.x) / 2, 420, track(t, [[18.2, .9], [20, 1.1]])]; }
  else if (t < 21) { const ca = carState(t); c = [ca.x, 380, 1.15]; }
  else if (t < 23.2) c = track(t, [[21.8, [620, 430, .95]], [22.55, [620, 430, 1.05]], [22.65, [640, 430, 1.3], "out"], [23.2, [800, 430, 1.1]]]);
  else if (t < 27) c = track(t, [[24.0, [1250, 400, 1.2]], [25, [1230, 380, 1.4]]]);
  else if (t < 29.25) { const tr = truckState(t), ca = carState(t); c = t < 29 ? [(tr.x + ca.x) / 2, 420, track(t, [[27, .95], [29, 1.12]])] : [560, 420, 1.35]; }
  else if (t < 31) { const ca = carState(t); c = [Math.max(-300, ca.x + 120), Math.min(420, ca.y - 60), .9]; }
  else if (t < 33.5) c = track(t, [[31, [-330, 560, 1.1]], [31.4, [-360, 600, 1.55], "out"], [33.5, [-360, 610, 1.6]]]);
  else c = track(t, [[33.5, [760, 330, .95]], [40, [790, 320, 1.08]]]);
  let sx = 0, sy = 0;
  for (const [t0, d, a] of SHAKES) if (inRange(t, t0, t0 + d)) { const k = 1 - (t - t0) / d; sx += Math.sin(t * 91) * a * k; sy += Math.cos(t * 73) * a * k; }
  return { x: c[0], y: c[1], z: c[2], sx, sy };
}

// =====================================================================
//  RENDU D'UNE IMAGE
// =====================================================================
const cache = {};
const g = id => cache[id] || (cache[id] = $(id));
function setT(id, tr) { g(id).setAttribute("transform", tr); }

function renderAt(t) {
  const sc = scene(t);
  show(g("title"), sc === "title"); show(g("world"), sc === "world"); show(g("vs"), sc === "vs");
  show(g("closeup"), sc === "cuEnemy" || sc === "cuHero"); show(g("split"), sc === "split"); show(g("end"), sc === "end");

  // ---------- TITRE ----------
  if (sc === "title") {
    setT("t-stripes", `translate(${-(t * 120) % 180} 0)`);
    const pop = (t0) => { const k = clamp((t - t0) / .35); return k <= 0 ? 0.001 : lerp(3, 1, E.back(k)); };
    setT("t-main", `translate(640 300) scale(${pop(.3)}) rotate(${-4 + Math.sin(t * 3) * 1.5})`);
    setT("t-sub", `translate(640 450) scale(${pop(.8)}) rotate(${3 - Math.sin(t * 3) * 1.5})`);
    const k = clamp((t - 1.5) / .4);
    setT("t-tag", `translate(${lerp(1600, 640, E.out(k))} 560)`);
  }

  // ---------- MONDE ----------
  if (sc === "world") {
    const cam = camera(t);
    setT("cam", `translate(${640 + cam.sx} ${360 + cam.sy}) scale(${cam.z}) translate(${-cam.x} ${-cam.y})`);
    setT("cloudsW", `translate(${(t * 12) % 400} 0)`);

    // camion
    const tr = truckState(t);
    setT("truckPos", `translate(${tr.x} ${tr.y}) rotate(${tr.rot}) scale(${tr.dir * TS} ${TS})`);
    const tw = (tr.x / (45 * TS)) * 180 / Math.PI * Math.sign(tr.dir || 1);
    const spin = inRange(t, 24.3, 25.0) || inRange(t, 27, 27.3) ? t * 2400 : 0;
    for (const id of ["tw1", "tw2", "tw3"]) setT(id, `rotate(${tw + spin})`);
    g("tr-light").setAttribute("fill", tr.engine ? "#fff3a0" : "#c9a92a");
    g("tr-beam").setAttribute("opacity", tr.engine ? (.22 + (inRange(t, 7.2, 7.6) ? .5 * Math.abs(Math.sin(t * 30)) : 0)).toFixed(2) : 0);
    // fumée

  const fan = [[33.6, 523], [33.8, 659], [34.0, 784], [34.25, 1047]];

  // fin
  boom(40.0); tone(41.0, 660, .15, "square", .15); tone(41.15, 880, .3, "square", .15);
  engine(41.8, 43.8, 200, 240, .05, "square");
}

window.renderAt = renderAt; window.DUR = DUR; window.buildAudio = buildAudio;
const params = new URLSearchParams(location.search);
let t0 = null, actx = null, playing = false;
function loop(now) {
  if (!playing) return;
  const t = actx ? actx.currentTime - t0 : (now / 1000 - t0);
  renderAt(Math.min(t, DUR));
  $("bar").style.width = (Math.min(1, t / DUR) * 100) + "%";
  if (t >= DUR) { playing = false; $("play").textContent = "↻ Revoir le film"; $("ui").classList.remove("hidden"); return; }
  requestAnimationFrame(loop);
}
$("play").onclick = () => {
  $("ui").classList.add("hidden");
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); t0 = actx.currentTime + .05; buildAudio(actx, actx.destination, t0); }
  catch (e) { actx = null; t0 = performance.now() / 1000; }
  playing = true; requestAnimationFrame(loop);
};
renderAt(params.has("t") ? +params.get("t") : 1.2);
if (params.has("capture")) $("ui").classList.add("hidden");
