<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond circulaire -->
  <circle cx="128" cy="128" r="120" fill="#6366f1" opacity="0.1"/>

  <!-- Livre ouvert -->
  <g transform="translate(128, 128)">
    <!-- Page gauche -->
    <path d="M -60 -50 Q -80 -30 -80 0 Q -80 30 -60 50 L -10 50 L -10 -50 Z"
          fill="#6366f1" opacity="0.8"/>
    <path d="M -60 -50 Q -40 -40 -20 -50 L -20 50 Q -40 40 -60 50 Z"
          fill="#818cf8" opacity="0.6"/>

    <!-- Page droite -->
    <path d="M 60 -50 Q 80 -30 80 0 Q 80 30 60 50 L 10 50 L 10 -50 Z"
          fill="#6366f1" opacity="0.8"/>
    <path d="M 60 -50 Q 40 -40 20 -50 L 20 50 Q 40 40 60 50 Z"
          fill="#818cf8" opacity="0.6"/>

    <!-- Reliure centrale -->
    <rect x="-5" y="-50" width="10" height="100" fill="#4f46e5"/>

    <!-- Lignes de texte -->
    <line x1="-50" y1="-30" x2="-25" y2="-30" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="-50" y1="-15" x2="-20" y2="-15" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="-50" y1="0" x2="-30" y2="0" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="-50" y1="15" x2="-25" y2="15" stroke="white" stroke-width="2" opacity="0.7"/>

    <line x1="25" y1="-30" x2="50" y2="-30" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="20" y1="-15" x2="50" y2="-15" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="30" y1="0" x2="50" y2="0" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="25" y1="15" x2="50" y2="15" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Texte -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
        fill="#6366f1" text-anchor="middle">Manga Reader</text>
</svg>
