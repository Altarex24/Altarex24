  const BUBBLES = [
    { t0: 1.3, t1: 3.2, who: "Z", text: "Grrr…" },
    { t0: 4.4, t1: 5.0, who: "V", text: "Hé !" },
    { t0: 5.0, t1: 5.9, who: "V", text: "Hrmm !!" },
    { t0: 10.85, t1: 11.35, who: "V", text: "Raté…" },
    { t0: 14.0, t1: 16.4, who: "Z", text: "Merci pour les émeraudes." },
  ];
  const CHAPTERS = [
    { t: 0, name: "Le marché", text: "Trois émeraudes, un villageois tranquille." },
    { t: 3.9, name: "Le vol", text: "Le zombie ramasse tout." },
    { t: 5.0, name: "La riposte", text: "Le villageois sort l'épée en diamant." },
    { t: 6.8, name: "Le combat", text: "Deux coups d'épée, quatre coups de poing." },
    { t: 12.2, name: "La fin", text: "Il n'a pas survécu longtemps." },
  ];

  const speed = (K, t) => Math.abs(keys(K, t) - keys(K, t - 0.05)) / 0.05;
  const walkSwing = (K, t) => Math.sin(keys(K, t) * 0.32) * 34 * Math.min(1, speed(K, t) / 22);
  const flash = (t, times, len = 0.4) => times.some((h) => t >= h && t < h + len) ? 0.5 : 0;
  const bump = (t, times) => { let y = 0; for (const h of times) if (t >= h && t < h + 0.3) y += 3.5 * Math.sin(Math.PI * (t - h) / 0.3); return y; };
  const hitsOnZombie = V_SWINGS.filter((s) => s.hit).map((s) => s.t);

  function villagerArmR(t) {
    let a = seg(t, T_DRAW, T_DRAW + 0.25, 0, -30);
    for (const { t: te } of V_SWINGS) {
      if (t >= te - 0.3 && t < te - 0.08) a = seg(t, te - 0.3, te - 0.08, -30, -165);
      else if (t >= te - 0.08 && t < te + 0.06) a = seg(t, te - 0.08, te + 0.06, -165, -12);
      else if (t >= te + 0.06 && t < te + 0.4) a = seg(t, te + 0.06, te + 0.4, -12, -30);
    }
    return a;
  }
  function zombieArm(t, side) {
    let a = (side ? -80 : -88) + Math.sin(t * 3 + side * 1.7) * 4;
    if (t > 3.9 && t < 5.2) a = t < 4.8 ? seg(t, 3.9, 4.2, a, -38) : seg(t, 4.8, 5.2, -38, a);
    for (const te of Z_PUNCHES) {
      if (t >= te - 0.25 && t < te - 0.08) a = seg(t, te - 0.25, te - 0.08, a, -58);
      else if (t >= te - 0.08 && t < te + 0.05) a = seg(t, te - 0.08, te + 0.05, -58, -104);
      else if (t >= te + 0.05 && t < te + 0.3) a = seg(t, te + 0.05, te + 0.3, -104, a);
    }
    // Victoire : bras droit (avec l'émeraude) levé bien haut, bras gauche qui s'agite
    if (t >= T_WIN) a = seg(t, T_WIN, T_WIN + 0.4, a, side ? -172 + Math.sin(t * 7) * 6 : -95 + Math.sin(t * 9) * 20);
    return a;
  }
  const hp = (t, times, dmg) => Math.max(0, 20 - dmg * times.filter((h) => t >= h).length);

  // Positions des 3 émeraudes posées au sol (objets qui tournent et flottent)
  const GEMS = [{ x: -2, z: -7, t: 4.3 }, { x: 3, z: 1, t: 4.45 }, { x: -1, z: 8, t: 4.6 }];

  // ---------- Rendu ----------
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W = Math.round(r.width * DPR); H = Math.round(r.height * DPR);
    cv.width = W; cv.height = H;
  }
  const LIGHT = (() => { const l = [-0.45, 0.8, 0.55], n = Math.hypot(...l); return l.map((v) => v / n); })();
  const CAM_D = 300;
  let camDrag = { yaw: 0, pitch: 0 };

  function render(t) {
    const camYaw = -16 + Math.sin(t * 0.35) * 7 + camDrag.yaw;
    const camPitch = Math.max(4, Math.min(60, 17 + camDrag.pitch));
    const VIEW = chain(RX(camPitch), RY(camYaw), T(2, -16, 0));
    const F = CAM_D * W / 150;
    const project = (p) => { const w = F / (CAM_D - p[2]); return [W / 2 + p[0] * w, H * 0.56 - p[1] * w, p[2]]; };
    const list = [];

    function addMesh(mesh, M, tint = 0) {
      const MV = mul(VIEW, M);
      for (const q of mesh.quads) {
        const n = q.n, v = q.v;
        let nx = M[0] * n[0] + M[1] * n[1] + M[2] * n[2];
        let ny = M[4] * n[0] + M[5] * n[1] + M[6] * n[2];
        let nz = M[8] * n[0] + M[9] * n[1] + M[10] * n[2];
        const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        const p0 = apply(MV, v[0], v[1], v[2]);
        const vnx = VIEW[0] * nx + VIEW[1] * ny + VIEW[2] * nz;
        const vny = VIEW[4] * nx + VIEW[5] * ny + VIEW[6] * nz;
        const vnz = VIEW[8] * nx + VIEW[9] * ny + VIEW[10] * nz;
        if (vnx * -p0[0] + vny * -p0[1] + vnz * (CAM_D - p0[2]) <= 0) continue;   // face arrière
        const pts = [project(p0)];
        for (let j = 3; j < 12; j += 3) pts.push(project(apply(MV, v[j], v[j + 1], v[j + 2])));
        const sh = 0.58 + 0.42 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
        const c = q.c;
        const r = c[0] * sh * (1 - tint) + 255 * tint, g = c[1] * sh * (1 - tint) + 40 * tint, b = c[2] * sh * (1 - tint) + 40 * tint;
        list.push({ z: (pts[0][2] + pts[1][2] + pts[2][2] + pts[3][2]) / 4, pts, col: `rgb(${r | 0},${g | 0},${b | 0})` });
      }
    }
    const particles = [];
    function burst(seed, t0, n, origin, colors, spread, life, up = 8, size = 1.2) {
      const dt = t - t0;
      if (dt < 0 || dt > life) return;
      const r = rng(seed);
      for (let i = 0; i < n; i++) {
        const vx = (r() - 0.5) * spread, vy = up * (0.4 + r()), vz = (r() - 0.5) * spread;
        const p = [origin[0] + vx * dt, origin[1] + vy * dt - 9 * dt * dt, origin[2] + vz * dt];
        const k = 1 - dt / life;
        particles.push({ p, s: size * (0.6 + r() * 0.8) * (0.5 + k), col: colors[Math.floor(r() * colors.length)], a: Math.min(1, k * 1.6) });
      }
    }

    // --- Villageois
    const vx = keys(VX, t);
    const dying = t >= T_DEATH;
    const vAlive = t < T_POOF;
    let vy = bump(t, Z_PUNCHES.slice(0, -1));
    if (t >= 5.0 && t < 5.6) vy += Math.abs(Math.sin((t - 5.0) * Math.PI / 0.3)) * 4;
    const fall = dying ? seg(t, T_DEATH + 0.05, T_DEATH + 0.5, 0, -90) : 0;
    const vTint = dying && vAlive ? 0.5 : flash(t, Z_PUNCHES);
    const EV = chain(T(vx, vy, 0), RY(90), RX(fall), T(-4, 0, -3));
    if (vAlive) {
      const legs = dying ? 0 : walkSwing(VX, t);
      addMesh(V.leg_l, mul(EV, about(V.leg_l.pivot, RX(legs))), vTint);
      addMesh(V.leg_r, mul(EV, about(V.leg_r.pivot, RX(-legs))), vTint);
      addMesh(V.body, EV, vTint);
      const shake = t > 4.4 && t < 4.95 ? Math.sin(t * 38) * 12 : 0;
      addMesh(V.head, mul(EV, about(V.head.pivot, chain(RY(shake), RX(Math.sin(t * 2) * 3)))), vTint);
      if (t < T_DRAW) {
        addMesh(V.arms_crossed, mul(EV, about(V.arms_crossed.pivot, RX(-43 + Math.sin(t * 2) * 2))), vTint);
      } else {
        addMesh(V.arm_l, mul(EV, about(V.arm_l.pivot, RX(-legs * 0.8 - 10))), vTint);
        const AR = mul(EV, about(V.arm_r.pivot, RX(villagerArmR(t))));
        addMesh(V.arm_r, AR, vTint);
        const k = seg(t, T_DRAW, T_DRAW + 0.2, 0.05, 1);
        const grip = [0, 0, 1, 9.5, 0, k, 0, 11.5 - 2.5 * k, k, 0, 0, 3 - 2.5 * k];
        addMesh(SWORD, mul(AR, grip), vTint * 0.4);
      }
    }
    // --- Zombie
    let zx = keys(ZX, t);
    let zy = bump(t, hitsOnZombie);
    const zYaw = t >= T_WIN ? seg(t, T_WIN, T_WIN + 0.6, -90, -28) : -90;
    if (t >= T_WIN) zy += Math.abs(Math.sin((t - T_WIN) * 5.5)) * 3;
    const zTint = flash(t, hitsOnZombie);
    const EZ = chain(T(zx, zy, 0), RY(zYaw), T(-4, 0, -2));
    const zLegs = walkSwing(ZX, t);
    addMesh(Z.leg_l, mul(EZ, about(Z.leg_l.pivot, RX(zLegs))), zTint);
    addMesh(Z.leg_r, mul(EZ, about(Z.leg_r.pivot, RX(-zLegs))), zTint);
    addMesh(Z.body, EZ, zTint);
    addMesh(Z.head, mul(EZ, about(Z.head.pivot, RX(t > 3.9 && t < 5 ? 18 : Math.sin(t * 1.6) * 4))), zTint);
    addMesh(Z.arm_l, mul(EZ, about(Z.arm_l.pivot, RX(zombieArm(t, 0)))), zTint);
    const ZR = mul(EZ, about(Z.arm_r.pivot, RX(zombieArm(t, 1))));
    addMesh(Z.arm_r, ZR, zTint);
    if (t >= 4.75) addMesh(GEM, mul(ZR, [0, 0, 1, 9.5, 0.5, 0, 0, 6, 0, 0.5, 0, -2]), zTint * 0.4);

    // --- Émeraudes au sol, puis aspirées par le zombie
    const hand = apply(ZR, 10, 10, 2);
    GEMS.forEach((g, i) => {
      if (t >= g.t + 0.35) return;
      let p = [g.x, 2 + Math.sin(t * 2.2 + i) * 1.2, g.z], s = 0.5;
      if (t >= g.t) { const u = ease((t - g.t) / 0.35); p = p.map((v, j) => v + (hand[j] - v) * u); s *= 1 - 0.6 * u; }
      addMesh(GEM, chain(T(...p), RY(t * 90 + i * 50), S(s), T(-8, 0, -0.5)));
      burst(100 + i, g.t, 5, [g.x, 6, g.z], ["#8ff5b4", "#41d67c", "#ffffff"], 18, 0.6, 10, 1);
    });
    // --- Épée lâchée à la mort
    if (t >= T_POOF) {
      addMesh(SWORD, chain(T(keys(VX, T_POOF) + 6, 2 + Math.sin(t * 2.2) * 1.2, 8), RY(t * 90), S(0.55), T(-8, 0, -0.5)));
    }

    // --- Particules
    hitsOnZombie.forEach((h, i) => burst(200 + i, h, 12, [keys(ZX, h) - 2, 20, 0], ["#ffffff", "#d8d8d8", "#b8b8b8"], 30, 0.6, 12, 1.4));
    Z_PUNCHES.forEach((h, i) => burst(300 + i, h, 7, [keys(VX, h) + 2, 22, 0], ["#6d1414", "#9b2222"], 20, 0.55, 10, 1.3));
    burst(400, T_POOF, 26, [keys(VX, T_POOF) - 14, 4, 0], ["#ffffff", "#e6e6e6", "#cfcfcf", "#bdbdbd"], 26, 1.1, 14, 3.2);
    burst(401, T_WIN + 0.2, 10, [keys(ZX, T_WIN) - 4, 34, 0], ["#8ff5b4", "#41d67c"], 22, 0.9, 16, 1.2);
    for (const pt of particles) {
      const v = apply(VIEW, ...pt.p), sp = project(v);
      const size = pt.s * F / (CAM_D - v[2]);
      list.push({ z: v[2], pts: null, x: sp[0], y: sp[1], size, col: pt.col, a: pt.a });
    }

    // ---------- Peinture ----------
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#8fc4f2"); sky.addColorStop(0.6, "#c8e3f6"); sky.addColorStop(1, "#e9f3f8");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    const ground = [];
    const GV = VIEW;
    for (const q of GROUND) {
      const v = q.v, n = q.n;
      const p0 = apply(GV, v[0], v[1], v[2]);
      const vn = [GV[0] * n[0] + GV[1] * n[1] + GV[2] * n[2], GV[4] * n[0] + GV[5] * n[1] + GV[6] * n[2], GV[8] * n[0] + GV[9] * n[1] + GV[10] * n[2]];
      if (vn[0] * -p0[0] + vn[1] * -p0[1] + vn[2] * (CAM_D - p0[2]) <= 0) continue;
      const pts = [project(p0)];
      for (let j = 3; j < 12; j += 3) pts.push(project(apply(GV, v[j], v[j + 1], v[j + 2])));
      const sh = 0.58 + 0.42 * Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
      ground.push({ z: (pts[0][2] + pts[2][2]) / 2, pts, col: `rgb(${q.c[0] * sh | 0},${q.c[1] * sh | 0},${q.c[2] * sh | 0})` });
    }
    ground.sort((a, b) => a.z - b.z);
    const drawQuad = (d) => {
      const p = d.pts;
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.lineTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]); ctx.closePath();
      ctx.fillStyle = d.col; ctx.strokeStyle = d.col; ctx.fill(); ctx.stroke();
    };
    ctx.lineWidth = 0.9; ctx.lineJoin = "round";
    ground.forEach(drawQuad);

    // Ombres portées
    const shadow = (x, r, alpha) => {
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const a = i / 24 * Math.PI * 2, p = project(apply(GV, x + Math.cos(a) * r, 0.1, Math.sin(a) * r));
        i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      }
      ctx.fillStyle = `rgba(20,40,10,${alpha})`; ctx.fill();
    };
    if (vAlive) shadow(dying ? vx - 12 * ease((t - T_DEATH) / 0.5) : vx, dying ? 13 : 8, 0.28);
    shadow(zx, 8, 0.28);

    list.sort((a, b) => a.z - b.z);
    for (const d of list) {
      if (d.pts) { drawQuad(d); continue; }
      ctx.globalAlpha = d.a; ctx.fillStyle = d.col;
      ctx.fillRect(d.x - d.size / 2, d.y - d.size / 2, d.size, d.size);
      ctx.globalAlpha = 1;
    }

    // ---------- Interface dans la scène ----------
    const U = Math.max(1.4, W / 720);
    const headPt = (x, y) => project(apply(GV, x, y, 0));
    if (vAlive && !dying) hud(headPt(vx, 44), "Villageois", hp(t, Z_PUNCHES, PUNCH_DMG), U);
    hud(headPt(zx, 42 + zy), "Zombie", hp(t, hitsOnZombie, SWORD_DMG), U);
    for (const b of BUBBLES) {
      if (t < b.t0 || t >= b.t1) continue;
      const p = b.who === "V" ? headPt(vx, 58) : headPt(zx, 56 + zy);
      bubble(p[0], p[1], b.text, U);
    }
    if (t >= 15) {
      ctx.globalAlpha = seg(t, 15, 15.5, 0, 1);
      banner("Le zombie repart avec les 3 émeraudes.", U);
      ctx.globalAlpha = 1;
    }
  }

  const HEART = [".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
  function heart(x, y, u, fill) {
    for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
      if (HEART[r][c] !== "X") continue;
      const on = fill === 2 || (fill === 1 && c < 4);
      ctx.fillStyle = on ? (r === 1 && c === 1 ? "#ff9c94" : "#d8261f") : "#3b1a1a";
      ctx.fillRect(x + c * u, y + r * u, u + 0.3, u + 0.3);
    }
  }
  function hud(p, name, life, U) {
    const u = U * 1.1, hw = 7 * u + u, total = 10 * hw - u;
    let x = p[0] - total / 2;
    const y = p[1] - 6 * u;
    for (let i = 0; i < 10; i++) heart(x + i * hw, y, u, life >= (i + 1) * 2 ? 2 : life === i * 2 + 1 ? 1 : 0);
    ctx.font = `${Math.round(9 * U)}px Silkscreen, monospace`;
    const tw = ctx.measureText(name).width;
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.fillRect(p[0] - tw / 2 - 4 * U, y - 16 * U, tw + 8 * U, 13 * U);
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(name, p[0], y - 9.5 * U);
  }
  function bubble(x, y, text, U) {
    ctx.font = `${Math.round(11 * U)}px Karla, sans-serif`;
    const tw = ctx.measureText(text).width, pw = tw + 14 * U, ph = 20 * U;
    const bx = Math.max(6 * U, Math.min(W - pw - 6 * U, x - pw / 2));
    const by = Math.max(8 * U, y - ph - 18 * U);
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#1e2126"; ctx.lineWidth = 1.5 * U;
    ctx.beginPath(); ctx.rect(bx, by, pw, ph); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 5 * U, by + ph); ctx.lineTo(x, by + ph + 7 * U); ctx.lineTo(x + 5 * U, by + ph); ctx.fill();
    ctx.fillStyle = "#1e2126"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, bx + pw / 2, by + ph / 2 + 0.5);
  }
  function banner(text, U) {
    ctx.font = `${Math.round(15 * U)}px Silkscreen, monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const y = H * 0.14;
    ctx.fillStyle = "#3a3a3a"; ctx.fillText(text, W / 2 + 2 * U, y + 2 * U);
    ctx.fillStyle = "#ffffff"; ctx.fillText(text, W / 2, y);
  }

  // ---------- Lecture ----------
  const playBtn = document.getElementById("play"), slowBtn = document.getElementById("slow");
  const scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
  const chaptersEl = document.getElementById("chapters");
  scrub.max = T_END;
  CHAPTERS.forEach((c, i) => {
    const li = document.createElement("li");
    li.tabIndex = 0;
    li.innerHTML = `<b>${String(i + 1).padStart(2, "0")} · ${c.t.toFixed(1)} s</b><span>${c.name}</span>`;
    li.title = c.text;
    const go = () => { time = c.t; };
    li.addEventListener("click", go);
    li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    chaptersEl.appendChild(li);
  });

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);
  let time = params.has("t") ? parseFloat(params.get("t")) : 0;
  let playing = !reduce && !params.has("t");
  let rate = 1, last = performance.now(), hold = 0;

  const setPlaying = (p) => { playing = p; playBtn.textContent = p ? "❚❚" : "▶"; playBtn.setAttribute("aria-label", p ? "Pause" : "Lecture"); };
  setPlaying(playing);
  playBtn.addEventListener("click", () => { if (!playing && time >= T_END) time = 0; setPlaying(!playing); });
  slowBtn.addEventListener("click", () => { rate = rate === 1 ? 0.5 : 1; slowBtn.setAttribute("aria-pressed", String(rate !== 1)); });
  scrub.addEventListener("input", () => { time = parseFloat(scrub.value); });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playBtn.click(); }
  });

  const stage = document.getElementById("stage");
  let drag = null;
  stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: camDrag.yaw, pitch: camDrag.pitch }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    camDrag.yaw = drag.yaw + (e.clientX - drag.x) * 0.4;
    camDrag.pitch = drag.pitch + (e.clientY - drag.y) * 0.25;
  });
  const endDrag = () => { drag = null; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("dblclick", () => { camDrag = { yaw: 0, pitch: 0 }; });

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      if (time >= T_END) { hold += dt; if (hold > 1.5) { time = 0; hold = 0; } }
      else time = Math.min(T_END, time + dt * rate);
    }
    if (cv.clientWidth * Math.min(2, window.devicePixelRatio || 1) !== W) resize();
    render(time);
    scrub.value = time;
    timeEl.textContent = `${time.toFixed(1)} / ${T_END.toFixed(1)} s`;
    let cur = 0; CHAPTERS.forEach((c, i) => { if (time >= c.t) cur = i; });
    [...chaptersEl.children].forEach((li, i) => li.setAttribute("aria-current", String(i === cur)));
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
